<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamWeave: interactive stories with narration</title>
    <meta name="description" content="Pick a hero and a world, steer the adventure, then listen to your story read aloud.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --background: #f5f5f5;
            --card-background: #ffffff;
            --input-border: #e0e0e0;
            --input-focus: rgba(37, 99, 235, 0.1);
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --transition: 0.3s ease;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #3b82f6;
                --primary-dark: #60a5fa;
                --text-primary: #ffffff;
                --text-secondary: #d1d5db;
                --background: #1a1a1a;
                --card-background: #2d2d2d;
                --input-border: #404040;
                --input-focus: rgba(59, 130, 246, 0.1);
                --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            transition: background-color var(--transition);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-background);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, var(--primary-color), var(--primary-dark));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGradient 6s ease infinite;
        }

        @keyframes titleGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1.1rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--input-border);
            border-radius: var(--radius);
            font-size: 1rem;
            background: var(--card-background);
            color: var(--text-primary);
            transition: all var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--input-focus);
        }

        .input-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #story-container {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--card-background);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(20px);
            transition: all var(--transition);
        }

        #story-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #story-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 1.5rem;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 1rem 0;
        }

        .loading span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--primary-color);
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 0.5s ease infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.1s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.2s;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        /* High Contrast Mode */
        @media (forced-colors: active) {
            button {
                border: 2px solid ButtonText;
            }
        }

        .audio-section {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--card-background);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .audio-section h3 {
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }

        .audio-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: var(--radius);
        }

        .listen-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .listen-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .listen-btn i {
            font-size: 1.2rem;
        }

        .hidden { display: none !important; }
        #story-text { white-space: pre-wrap; line-height: 1.7; }
        #story-text .choice { display: block; margin: 1rem 0; font-style: italic; color: var(--primary-color); }
        #story-text .part { display: block; }
        .cursor::after { content: "\258B"; animation: blink 1s steps(1) infinite; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }
        .banner { background: var(--input-focus); border: 1px solid var(--primary-color); border-radius: var(--radius);
                  padding: .75rem 1rem; margin-bottom: 1.25rem; font-size: .95rem; color: var(--text-secondary); }
        .error { color: #dc2626; min-height: 1.4rem; margin-top: .75rem; }
        .progress { color: var(--text-secondary); font-size: .9rem; margin-bottom: .75rem; }
    </style>
</head>

<body>
    <div class="container">
        <h1>DreamWeave</h1>
        {% if demo %}
        <div class="banner" id="demo-banner">
            Demo mode: stories come from a built-in storyteller and narration is a short chime, so this page runs with no paid API keys.
            With xAI and ElevenLabs keys configured, the same flow streams a fresh AI story and a real voice reading.
        </div>
        {% endif %}
        <form id="start-form" autocomplete="off">
            <div class="input-group">
                <label for="hero">Choose your hero</label>
                <input type="text" id="hero" maxlength="60" required placeholder="e.g., Brave Knight, Wise Wizard...">
                <i class="fas fa-user input-icon"></i>
            </div>
            <div class="input-group">
                <label for="world">Choose your world</label>
                <input type="text" id="world" maxlength="60" required placeholder="e.g., Enchanted Forest, Space Station...">
                <i class="fas fa-map-marker-alt input-icon"></i>
            </div>
            <button id="start-btn" type="submit"><i class="fas fa-book-open"></i> Begin Your Adventure</button>
        </form>

        <div id="story-container" class="hidden">
            <div class="progress" id="progress"></div>
            <div id="story-text" role="article" aria-live="polite"></div>
            <form id="turn-form" autocomplete="off">
                <div class="input-group">
                    <input type="text" id="choice" maxlength="200" placeholder="What happens next? Type your idea here!" aria-label="Your choice">
                    <i class="fas fa-pencil-alt input-icon"></i>
                </div>
                <button id="continue-btn" type="submit"><i class="fas fa-arrow-right"></i> Continue the Story</button>
            </form>

            <div class="audio-section hidden" id="audio-section">
                <h3>Listen to Your Story</h3>
                <div class="audio-controls">
                    <button class="listen-btn" id="listen-btn" type="button"><i class="fas fa-volume-up"></i> Read it to me</button>
                    <audio id="story-audio" controls class="hidden"></audio>
                </div>
            </div>
            <button id="new-story-btn" type="button" class="hidden"><i class="fas fa-plus"></i> Start a New Adventure</button>
        </div>
        <div class="error" id="error" role="alert"></div>
    </div>

    <script>
    (() => {
        const $ = (id) => document.getElementById(id);
        let storyId = null;
        let busy = false;
        const TOTAL_STEPS = 3;
        let step = 0;

        function setBusy(on) {
            busy = on;
            document.querySelectorAll("button").forEach((b) => (b.disabled = on));
        }
        function showError(msg) { $("error").textContent = msg || ""; }

        async function readError(res) {
            try { return (await res.json()).error; } catch { return "Something went wrong. Please try again."; }
        }

        // Streams a story part into a new paragraph. Text is inserted with
        // textContent, never as HTML, so model output cannot inject markup.
        async function streamPart(url, body) {
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body),
            });
            if (!res.ok) throw new Error(await readError(res));
            storyId = res.headers.get("X-Story-Id") || storyId;
            const finished = res.headers.get("X-Story-Finished") === "true";
            const part = document.createElement("span");
            part.className = "part cursor";
            $("story-text").appendChild(part);
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            for (;;) {
                const { value, done } = await reader.read();
                if (done) break;
                part.textContent += decoder.decode(value, { stream: true });
            }
            part.classList.remove("cursor");
            return finished;
        }

        function updateProgress(finished) {
            $("progress").textContent = finished ? "The end" : `Chapter ${step} of ${TOTAL_STEPS}`;
        }

        $("start-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (busy) return;
            const hero = $("hero").value.trim(), world = $("world").value.trim();
            if (!hero || !world) return showError("Please fill in both fields to begin your adventure!");
            showError(""); setBusy(true);
            $("start-form").classList.add("hidden");
            $("story-container").classList.remove("hidden");
            $("story-container").classList.add("visible");
            step = 1; updateProgress(false);
            try {
                await streamPart("/api/stories", { hero, world });
                $("choice").focus();
            } catch (err) {
                showError(err.message);
                $("start-form").classList.remove("hidden");
                $("story-container").classList.add("hidden");
                $("story-text").textContent = "";
            } finally { setBusy(false); }
        });

        $("turn-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            if (busy) return;
            const choice = $("choice").value.trim();
            if (!choice) return showError("Please tell us what happens next!");
            showError(""); setBusy(true);
            const echo = document.createElement("span");
            echo.className = "choice";
            echo.textContent = "You decided: " + choice;
            $("story-text").appendChild(echo);
            try {
                const finished = await streamPart(`/api/stories/${storyId}/turns`, { choice });
                $("choice").value = "";
                step += 1; updateProgress(finished);
                if (finished) {
                    $("turn-form").classList.add("hidden");
                    $("audio-section").classList.remove("hidden");
                    $("new-story-btn").classList.remove("hidden");
                }
            } catch (err) {
                echo.remove();
                showError(err.message);
            } finally { setBusy(false); }
        });

        $("listen-btn").addEventListener("click", async () => {
            if (busy) return;
            showError(""); setBusy(true);
            $("listen-btn").innerHTML = '<i class="fas fa-spinner fa-spin"></i> Recording the narration...';
            try {
                const res = await fetch(`/api/stories/${storyId}/narration`, { method: "POST" });
                if (!res.ok) throw new Error(await readError(res));
                const { audio_url } = await res.json();
                const audio = $("story-audio");
                audio.src = audio_url;
                audio.classList.remove("hidden");
                $("listen-btn").classList.add("hidden");
                await audio.play().catch(() => {});
            } catch (err) {
                showError(err.message);
                $("listen-btn").innerHTML = '<i class="fas fa-volume-up"></i> Read it to me';
            } finally { setBusy(false); }
        });

        $("new-story-btn").addEventListener("click", () => location.reload());
    })();
    </script>
</body>
</html>
